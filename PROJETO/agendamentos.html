<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beleza & Estilo - Agendamentos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <div class="logo-icon">✂</div>
        <div class="logo-text">
          <h1>Beleza & Estilo</h1>
          <p>Gestão de Salão (Sprint 4 - LGPD & Realtime)</p>
        </div>
      </div>
      <div class="auth-buttons">
        <button class="btn-login">➜] Entrar</button>
        <button class="btn-register">+ Criar Conta</button>
      </div>
    </header>

    <nav class="tabs">
      <a href="agendamentos.html" class="tab-item active">📅 Agendamentos</a>
      <a href="catalogo.html" class="tab-item">📋 Catálogo de Serviços</a>
      <a href="clientes.html" class="tab-item">👥 Gestão de Clientes (Recepção)</a>
      <a href="meus-dados.html" class="tab-item">🔒 Meus Dados (LGPD)</a>
    </nav>

    <main class="grid-2">
      <section class="card">
        <h2>📅 Novo Agendamento</h2>
        <br>
        <form>
          <div class="form-group">
            <label>Cliente</label>
            <input type="text" placeholder="Seu Nome / Nome do Cliente">
          </div>
          <div class="form-group">
            <label>Serviço</label>
            <select>
              <option>Corte feminino - R$ 120,00</option>
              <option>Manicure - R$ 50,00</option>
              <option>Corte Masculino - R$ 65,00</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group" style="flex: 1;">
              <label>Data</label>
              <input type="date" value="2026-11-03">
            </div>
            <div class="form-group" style="flex: 1;">
              <label>Horário</label>
              <select><option>14:00</option><option>15:00</option></select>
            </div>
          </div>
          <button type="submit" class="btn-primary">✓ Confirmar Agendamento</button>
        </form>
      </section>

      <section class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <h2>📋 Agenda da Recepção</h2>
          <span style="font-size: 11px; color: var(--accent-green);">⚡ Sincronização em tempo real ativada (&lt; 5s)</span>
        </div>
        <div class="empty-state">
          Nenhum agendamento pendente no momento.
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
</body>
</html>
